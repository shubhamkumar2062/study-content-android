org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# androidx core 1.19 / lifecycle 2.11 need compileSdk 37; AGP 9.1 warns above 36.
android.suppressUnsupportedCompileSdk=37
# The Kotlin daemon cannot be reached from the sandboxed shell; compile in Gradle's own process.
kotlin.compiler.execution.strategy=in-process

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
